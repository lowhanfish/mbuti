[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mbuti-backend"
version = "0.1.0"
description = "Backend FastAPI MBUTI (Multi-agent Business & Unified Task Intelligence)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "celery[redis]>=5.4.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "google-genai>=2.27.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    # Halaman PDF bergambar dan berkas gambar (E1c); pypdfium2 Apache/BSD, Pillow HPND
    "pypdfium2>=5.0.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.18",
    # Pencarian internet gratis (E1d); ddgs MIT, primp MIT, lxml BSD
    "ddgs>=9.16.1,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
# Jejak galat singkat: bentuk panjang mencetak argumen fungsi, termasuk kata sandi koneksi.
addopts = "--tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]
known-third-party = ["alembic"]
