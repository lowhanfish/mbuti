# Salin ke /etc/nginx/conf.d/mbuti.conf, ganti mbuti.contoh.go.id dan alamat sertifikat.
# Sertifikat bisa dibuat dengan certbot.

# Lapisan pertama pembatas laju; batas per pengguna ada di aplikasi.
limit_req_zone $binary_remote_addr zone=mbuti_masuk:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=mbuti_api:10m rate=30r/s;

upstream mbuti_api { server 127.0.0.1:8000; }
upstream mbuti_web { server 127.0.0.1:3000; }

server {
    listen 80;
    listen [::]:80;
    server_name mbuti.contoh.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mbuti.contoh.go.id;

    ssl_certificate     /etc/letsencrypt/live/mbuti.contoh.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbuti.contoh.go.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # Sedikit di atas MAX_UPLOAD_BYTES (20 MB) untuk kolom formulir
    client_max_body_size 22m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Ditimpa, bukan ditambah, agar pengunjung tidak bisa memalsukan alamatnya
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    limit_req_status 429;

    location /api/v1/auth/ {
        limit_req zone=mbuti_masuk burst=15 nodelay;
        proxy_pass http://mbuti_api;
    }

    location /api/ {
        limit_req zone=mbuti_api burst=60 nodelay;
        # Uji coba role menunggu jawaban model
        proxy_read_timeout 300s;
        proxy_pass http://mbuti_api;
    }

    location /_next/static/ {
        proxy_pass http://mbuti_web;
    }

    location / {
        proxy_pass http://mbuti_web;
    }
}
